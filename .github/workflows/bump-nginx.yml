name: Bump NGINX mainline version

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-nginx
  cancel-in-progress: false

jobs:
  bump-nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Determine latest NGINX mainline from CHANGES
        id: latest
        run: |
          set -euo pipefail

          CHANGES="$(curl -fsSL --retry 3 --retry-all-errors https://nginx.org/en/CHANGES)"

          LATEST="$(
            printf '%s\n' "$CHANGES" \
              | grep -oE 'Changes with nginx [0-9]+\.[0-9]+\.[0-9]+' \
              | awk '{print $4}' \
              | awk -F. '$2 % 2 == 1 { print; exit }'
          )"

          if [ -z "$LATEST" ]; then
            echo "Could not determine latest NGINX mainline version from CHANGES" >&2
            exit 1
          fi

          echo "Detected latest mainline: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Read current NGINX_VERSION from build.sh
        id: current
        run: |
          set -euo pipefail

          CURRENT="$(
            sed -nE 's/^[[:space:]]*readonly[[:space:]]+NGINX_VERSION[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' build.sh \
              | head -n1
          )"

          if [ -z "$CURRENT" ]; then
            echo "Could not find readonly NGINX_VERSION in build.sh" >&2
            exit 1
          fi

          echo "Detected build.sh version: $CURRENT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Update build.sh
        if: steps.latest.outputs.latest != steps.current.outputs.current
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail

          sed -i -E \
            "s|^([[:space:]]*readonly[[:space:]]+NGINX_VERSION[[:space:]]*=[[:space:]]*)\"[0-9]+\.[0-9]+\.[0-9]+\"|\1\"${LATEST}\"|" \
            build.sh

          grep -nE '^[[:space:]]*readonly[[:space:]]+NGINX_VERSION[[:space:]]*=' build.sh

          curl -fsI --retry 3 --retry-all-errors \
            "https://nginx.org/download/nginx-${LATEST}.tar.gz" > /dev/null

          git diff -- build.sh

      - name: Open pull request
        if: steps.latest.outputs.latest != steps.current.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/bump-nginx-${{ steps.latest.outputs.latest }}
          PR_TITLE: "chore(nginx): bump NGINX mainline from ${{ steps.current.outputs.current }} to ${{ steps.latest.outputs.latest }}"
          PR_LABELS: dependencies,nginx,docker
          PR_PATHS: build.sh
          PR_BODY: |
            Automated update for the latest NGINX mainline release.

            - Previous version: `${{ steps.current.outputs.current }}`
            - New version: `${{ steps.latest.outputs.latest }}`
            - Changes: https://nginx.org/en/CHANGES

            This updates `NGINX_VERSION` in `build.sh`, which is used by both host and Docker builds. The build verifies the release signature against the keys pinned in `luna/nginx-signing-keys.txt`.
        run: .github/scripts/open-pull-request.sh
