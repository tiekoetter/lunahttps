name: Build Docker image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-image-${{ (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && 'latest' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lunahttps
  IMAGE_DESCRIPTION: Custom NGINX build with the latest stable OpenSSL, HTTP/3, Brotli, GeoIP2, headers-more and substitutions filter
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build and push image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    # Each matrix leg sets only the output named after its architecture.
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}

    # For workflow_run, only publish when CI succeeded for a commit of this
    # repository. The branch filter above matches the head branch name, which a
    # pull request from a fork can also set to "main".
    # Tag pushes and manual runs run directly.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Resolve source tag
        id: source
        run: |
          echo "tag=sha-${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') }}
            type=ref,event=tag
            type=raw,value=${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Luna-HTTP/S
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.url=https://lunahttps.tiekoetter.net
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          annotations: |
            org.opencontainers.image.title=Luna-HTTP/S
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.url=https://lunahttps.tiekoetter.net
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=lunahttps-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lunahttps-${{ matrix.arch }}

      - name: Export image digest
        id: digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${ARCH}=${DIGEST}" >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    permissions:
      packages: write
      # Sign and store the build provenance attestation.
      id-token: write
      attestations: write

    steps:
      - name: Resolve source tag
        id: source
        run: |
          echo "tag=sha-${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') }}
            type=ref,event=tag
            type=raw,value=${{ steps.source.outputs.tag }}

      - name: Create multi-arch manifest
        id: manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_TAG: ${{ steps.source.outputs.tag }}
          AMD64_DIGEST: ${{ needs.build.outputs.amd64 }}
          ARM64_DIGEST: ${{ needs.build.outputs.arm64 }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              tag_args+=("-t" "${tag}")
            fi
          done <<< "${TAGS}"

          docker buildx imagetools create \
            "${tag_args[@]}" \
            --annotation "index:org.opencontainers.image.title=Luna-HTTP/S" \
            --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.url=https://lunahttps.tiekoetter.net" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
            "${IMAGE_NAME}@${AMD64_DIGEST}" \
            "${IMAGE_NAME}@${ARM64_DIGEST}"

          digest="$(
            docker buildx imagetools inspect "${IMAGE_NAME}:${SOURCE_TAG}" \
              --format '{{json .Manifest}}' | jq -r '.digest'
          )"

          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not determine the manifest digest: ${digest}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          # Storage records are only available to organization-owned repositories.
          create-storage-record: false
