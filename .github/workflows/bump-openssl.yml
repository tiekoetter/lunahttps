name: Bump OpenSSL version

on:
  workflow_dispatch:
  schedule:
    - cron: "25 5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-openssl
  cancel-in-progress: false

env:
  # Primary key fingerprint of the OpenSSL release signing certificate, as
  # published on https://openssl-library.org/source/.
  OPENSSL_SIGNING_KEY: B146647E45A7B33947AB226B2A2C87D161692D40

jobs:
  bump-openssl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read current OpenSSL pin
        id: current
        run: |
          set -euo pipefail

          # shellcheck source=/dev/null
          . luna/openssl-version.env

          : "${OPENSSL_VERSION:?OPENSSL_VERSION is required}"

          echo "Pinned OpenSSL release: ${OPENSSL_VERSION}"
          echo "version=${OPENSSL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine latest stable OpenSSL release
        id: latest
        env:
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          set -euo pipefail

          SOURCE_PAGE="$(curl -fsSL --retry 3 --retry-all-errors https://openssl-library.org/source/)"

          # Pre-releases carry a suffix (openssl-4.2.0-beta1.tar.gz) and do not match.
          LATEST="$(
            printf '%s\n' "$SOURCE_PAGE" \
              | { grep -oE 'openssl-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' || true; } \
              | sed -E 's/^openssl-(.*)\.tar\.gz$/\1/' \
              | sort -V \
              | tail -n1
          )"

          if [ -z "$LATEST" ]; then
            echo "Could not determine the latest stable OpenSSL release" >&2
            exit 1
          fi

          NEWEST="$(printf '%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n1)"
          if [ "$NEWEST" != "$LATEST" ]; then
            echo "Latest listed release ${LATEST} is older than the pinned ${CURRENT}" >&2
            exit 1
          fi

          echo "Latest stable OpenSSL release: ${LATEST}"
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Download and verify the release
        id: release
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail

          TARBALL="openssl-${VERSION}.tar.gz"
          URL="https://github.com/openssl/openssl/releases/download/openssl-${VERSION}/${TARBALL}"
          WORK_DIR="$(mktemp -d)"

          export GNUPGHOME="${WORK_DIR}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"

          fetch() {
            curl -fsSL --retry 3 --retry-all-errors \
              --proto '=https' --proto-redir '=https' \
              --output "$1" "$2"
          }

          fetch "${WORK_DIR}/${TARBALL}" "${URL}"
          fetch "${WORK_DIR}/${TARBALL}.asc" "${URL}.asc"
          fetch "${WORK_DIR}/pubkeys.asc" https://openssl-library.org/source/pubkeys.asc

          gpg --batch --quiet --import "${WORK_DIR}/pubkeys.asc"

          VERIFY_STATUS="$(
            gpg --batch --status-fd 1 --verify \
              "${WORK_DIR}/${TARBALL}.asc" "${WORK_DIR}/${TARBALL}"
          )"

          # pubkeys.asc also holds superseded keys; accept only a good signature
          # that chains to the pinned primary key.
          grep -q '^\[GNUPG:\] GOODSIG ' <<< "${VERIFY_STATUS}" || {
            echo "GPG did not report a good signature for ${TARBALL}" >&2
            exit 1
          }

          SIGNER="$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $NF; exit }' <<< "${VERIFY_STATUS}")"
          if [ "${SIGNER}" != "${OPENSSL_SIGNING_KEY}" ]; then
            echo "${TARBALL} was not signed by the pinned OpenSSL key: ${SIGNER:-none}" >&2
            exit 1
          fi

          SHA256="$(sha256sum "${WORK_DIR}/${TARBALL}" | awk '{print $1}')"

          echo "Verified ${TARBALL} (signed by ${SIGNER})"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Update OpenSSL pin
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail

          sed -i -E \
            -e "s|^OPENSSL_VERSION=.*|OPENSSL_VERSION=\"${VERSION}\"|" \
            -e "s|^OPENSSL_SHA256=.*|OPENSSL_SHA256=\"${SHA256}\"|" \
            luna/openssl-version.env

          git diff -- luna/openssl-version.env

      - name: Open pull request
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/bump-openssl-${{ steps.latest.outputs.version }}
          PR_TITLE: "chore(openssl): bump OpenSSL from ${{ steps.current.outputs.version }} to ${{ steps.latest.outputs.version }}"
          PR_LABELS: dependencies,openssl,security
          PR_PATHS: luna/openssl-version.env
          PR_BODY: |
            Automated update to the latest stable OpenSSL release.

            - Previous version: `${{ steps.current.outputs.version }}`
            - New version: `${{ steps.latest.outputs.version }}`
            - New SHA256: `${{ steps.release.outputs.sha256 }}`
            - Source tarball: ${{ steps.release.outputs.url }}
            - Release notes: https://github.com/openssl/openssl/releases/tag/openssl-${{ steps.latest.outputs.version }}

            The tarball's PGP signature was verified against the OpenSSL release key `${{ env.OPENSSL_SIGNING_KEY }}` before its SHA256 was pinned.

            A change of the major or minor version can remove or change TLS features; check the release notes before merging.
        run: .github/scripts/open-pull-request.sh
