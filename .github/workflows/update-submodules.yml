name: Update submodules

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          # Full history is needed to list the upstream commits in the pull request.
          fetch-depth: 0

      - name: Update direct submodules to latest remote commits
        run: |
          git submodule sync --recursive
          git submodule update --init --remote
          # Direct updates can change the nested commits recorded by a submodule.
          git submodule foreach 'git submodule update --init --recursive'

      - name: Abort if any direct submodule is dirty internally
        run: |
          # The quoted commands intentionally run inside each submodule.
          # shellcheck disable=SC2016
          if ! git submodule foreach '
            git diff --quiet &&
            git diff --cached --quiet &&
            test -z "$(git ls-files --others --exclude-standard)"
          '; then
            echo "A direct submodule has local modified or untracked files after update."
            # shellcheck disable=SC2016
            git submodule foreach 'echo "== $name =="; git status --short'
            exit 1
          fi

      - name: Check for recorded submodule SHA changes
        id: changes
        run: |
          if git diff --quiet --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/update-submodules
          PR_TITLE: "chore(submodules): update submodules"
          PR_LABELS: dependencies,submodules
          PR_PATHS: luna/modules
        run: |
          set -euo pipefail

          # Upstream commit subjects are untrusted text: keep them inside a code
          # block and drop backticks so they cannot break out of it.
          PR_BODY="$(
            echo "Automated submodule update."
            echo
            echo "These modules are compiled into the server, so review the upstream changes before merging."

            while IFS= read -r path; do
              old="$(git rev-parse "HEAD:${path}")"
              new="$(git -C "${path}" rev-parse HEAD)"
              url="$(git -C "${path}" remote get-url origin)"

              echo
              echo "### \`${path#luna/modules/}\`"
              echo
              echo "${url%.git}/compare/${old}...${new}"
              echo
              echo '```text'
              git -C "${path}" log --format='%h %s' --max-count=50 "${old}..${new}" | tr -d '`' ||
                echo "(commit list unavailable)"
              echo '```'
            done < <(git diff --name-only --ignore-submodules=dirty -- luna/modules)
          )"
          export PR_BODY

          echo "${PR_BODY}"
          .github/scripts/open-pull-request.sh
