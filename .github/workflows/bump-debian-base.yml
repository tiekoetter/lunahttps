name: Bump Debian base image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-debian-base
  cancel-in-progress: false

jobs:
  bump-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check current Debian stable codename
        id: debian
        run: |
          set -euo pipefail

          STABLE="$(
            curl -fsSL --retry 3 --retry-all-errors \
              https://deb.debian.org/debian/dists/stable/Release \
              | awk '$1 == "Codename:" && !found { print $2; found = 1 }'
          )"
          CURRENT="$(grep -E '^ARG DEBIAN_VERSION=' Dockerfile | head -n1 | cut -d= -f2)"

          if ! [[ "${STABLE}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Invalid Debian stable codename: ${STABLE}" >&2
            exit 1
          fi

          if ! [[ "${CURRENT}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Invalid Dockerfile Debian codename: ${CURRENT}" >&2
            exit 1
          fi

          echo "Dockerfile Debian codename: ${CURRENT}"
          echo "Debian stable codename: ${STABLE}"

          echo "stable=${STABLE}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile
        if: steps.debian.outputs.current != steps.debian.outputs.stable
        env:
          STABLE: ${{ steps.debian.outputs.stable }}
        run: |
          set -euo pipefail

          sed -i -E "s/^ARG DEBIAN_VERSION=.*/ARG DEBIAN_VERSION=${STABLE}/" Dockerfile
          git diff -- Dockerfile

      - name: Open pull request
        if: steps.debian.outputs.current != steps.debian.outputs.stable
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: chore/bump-debian-${{ steps.debian.outputs.stable }}
          PR_TITLE: "chore(docker): bump Debian base from ${{ steps.debian.outputs.current }} to ${{ steps.debian.outputs.stable }}"
          PR_LABELS: dependencies,docker,debian
          PR_PATHS: Dockerfile
          PR_BODY: |
            Debian stable has changed.

            This updates the Docker base image codename:

            ```diff
            - ARG DEBIAN_VERSION=${{ steps.debian.outputs.current }}
            + ARG DEBIAN_VERSION=${{ steps.debian.outputs.stable }}
            ```

            Review carefully: a Debian major release can affect build dependencies, NGINX modules, and runtime libraries.
        run: .github/scripts/open-pull-request.sh
