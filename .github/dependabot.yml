version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # Actions are referenced by exact version tag, so every upstream release
    # arrives as a reviewable pull request. Wait a week before proposing a new
    # release; security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
